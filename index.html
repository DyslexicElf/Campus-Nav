<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus-Nav</title>
    <link rel="stylesheet" href="stylesheets/style.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <header>
        <h1 id="building-title">Campus-Nav</h1>
    </header>

    <main class="container">
        <section class="card">
            <h2>Building Directory</h2>
            <p class="subtitle-text">Select a floor, scan a room QR code, or type a room ID below:</p>

            <div class="search-group">
                <input type="text" id="manual-room-input" placeholder="e.g., 108, 317, 014" autocomplete="off">
                <button id="manual-locate-btn">Locate</button>
                <button id="scan-qr-btn">Scan QR</button>
            </div>
            
            <div class="options-group" style="margin-top: 10px;">
                <input type="checkbox" id="accessible-toggle">
                <label for="accessible-toggle">Require Elevator / Accessible Route</label>
            </div>

            <div id="reader" style="width: 100%; max-width: 400px; margin: 10px auto; display: none;"></div>
            <p id="search-error-msg" style="display: none; color: #ff3b30; font-size: 13px; margin-top: 5px; font-weight: bold;"></p>

            <nav class="floor-menu">
                <button class="floor-btn" data-floor="1">Basement</button>
                <button class="floor-btn active" data-floor="2">1st Floor</button>
                <button class="floor-btn" data-floor="3">2nd Floor</button>
                <button class="floor-btn" data-floor="4">3rd Floor</button>
            </nav>

            <div class="map-wrapper">
                <img src="" alt="Floor Layout" class="mobile-map" id="current-floor-map">
                <svg id="path-overlay"></svg>
                <div id="location-pin"></div>
                <div id="start-pin"></div>
            </div>
        </section>
    </main>

    <section id="admin-qr-dashboard">
        <h2>Bulk Room QR Code Sheet</h2>
        <p>Press <strong>Ctrl + P</strong> (or Cmd + P on Mac) to print this page or save it as a PDF sticker index directory!</p>
        <div id="qr-grid"></div>
    </section>

    <div id="debug-toggle">DEBUG</div>

    <script>
    const baseUrl = window.location.origin + window.location.pathname.replace(/\/$/, "");
    
    // --- MULTI-BUILDING DYNAMIC CONFIGURATION ---
    const urlParams = new URLSearchParams(window.location.search);
    let activeBuilding = urlParams.get('building') || 'campus'; 
    
    // Updates the main header to e.g., "Engineering Campus-Nav"
    document.getElementById('building-title').innerText = activeBuilding.charAt(0).toUpperCase() + activeBuilding.slice(1) + " Campus-Nav";

    // Global variables
    let currentActivePath = [];
    let activeTargetRoom = null;
    let currentStartNode = "n1"; 
    let waypoints = {};
    let roomDatabase = {};
    let isDebugMode = false;

    const mapImage = document.getElementById('current-floor-map');
    const buttons = document.querySelectorAll('.floor-btn');
    const svgOverlay = document.getElementById('path-overlay');
    const pin = document.getElementById('location-pin');
    const startPin = document.getElementById('start-pin');
    const roomInput = document.getElementById('manual-room-input');
    const errorMsg = document.getElementById('search-error-msg');
    const locateBtn = document.getElementById('manual-locate-btn');
    const scanBtn = document.getElementById('scan-qr-btn');
    const readerDiv = document.getElementById('reader');
    const qrGrid = document.getElementById('qr-grid');

    // ==========================================
    // 1. FRONTEND JAVASCRIPT DIJKSTRA ALGORITHM
    // ==========================================
    function calculateShortestPath(startNode, endNode, requiresAccessible) {
        const distances = {};
        const previous = {};
        const queue = [];

        // Initialize distances
        for (const nodeId in waypoints) {
            distances[nodeId] = Infinity;
            previous[nodeId] = null;
        }
        
        distances[startNode] = 0;
        queue.push({ id: startNode, distance: 0 });

        while (queue.length > 0) {
            queue.sort((a, b) => a.distance - b.distance);
            const currentItem = queue.shift();
            const current = currentItem.id;
            const currentDist = currentItem.distance;

            if (current === endNode) break;
            if (currentDist > distances[current]) continue;

            const neighbors = waypoints[current].neighbors;
            
            for (const neighbor of neighbors) {
                const floor1 = waypoints[current].floor;
                const floor2 = waypoints[neighbor].floor;

                if (requiresAccessible && floor1 !== floor2) {
                    const currentIsElevator = waypoints[current].isElevator === true;
                    const neighborIsElevator = waypoints[neighbor].isElevator === true;
                    if (!currentIsElevator || !neighborIsElevator) continue;
                }

                const x1 = waypoints[current].x;
                const y1 = waypoints[current].y;
                const x2 = waypoints[neighbor].x;
                const y2 = waypoints[neighbor].y;

                const distance2D = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
                const floorPenalty = (floor1 !== floor2) ? 50.0 : 0.0;
                const weight = distance2D + floorPenalty;
                const altDistance = currentDist + weight;

                if (altDistance < distances[neighbor]) {
                    distances[neighbor] = altDistance;
                    previous[neighbor] = current;
                    queue.push({ id: neighbor, distance: altDistance });
                }
            }
        }

        const path = [];
        let curr = endNode;
        while (curr) {
            path.push(curr);
            curr = previous[curr];
        }
        return path.reverse();
    }


    // ==========================================
    // 2. UI NAVIGATION & SEARCH
    // ==========================================
    function setActiveFloor(floorNumber) {
        buttons.forEach(button => {
            const targetIndex = button.getAttribute('data-floor');
            if (targetIndex === floorNumber.toString()) {
                buttons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                mapImage.setAttribute('src', `images/${activeBuilding}/floor${floorNumber}.png`);
                renderPath(floorNumber);
            }
        });
    }

    function showRoomLocation(targetRoom) {
        activeTargetRoom = targetRoom;
        pin.dataset.targetFloor = targetRoom.floor;
        pin.style.left = targetRoom.x + '%';
        pin.style.top = targetRoom.y + '%';
        pin.style.display = 'block';
        setActiveFloor(targetRoom.floor);
    }

    function previewRoomLocation() {
        const queryRoom = roomInput.value.trim().toUpperCase();
        const targetRoom = roomDatabase[queryRoom];
        currentActivePath = [];
        errorMsg.style.display = 'none';

        if (targetRoom) {
            showRoomLocation(targetRoom);
            return;
        }

        activeTargetRoom = null;
        pin.style.display = 'none';
        const activeButton = document.querySelector('.floor-btn.active');
        if (activeButton) {
            renderPath(activeButton.getAttribute('data-floor'));
        }
    }

    buttons.forEach(button => {
        button.addEventListener('click', function () {
            const floorIndex = this.getAttribute('data-floor');
            setActiveFloor(floorIndex);
            pin.style.display = (pin.dataset.targetFloor === floorIndex) ? 'block' : 'none';
        });
    });

    function executeManualSearch() {
        const queryRoom = roomInput.value.trim().toUpperCase();
        errorMsg.style.display = 'none';
        currentActivePath = []; 
        activeTargetRoom = null; 
        
        if (!queryRoom) {
            errorMsg.textContent = "Please enter a room number.";
            errorMsg.style.display = 'block';
            return;
        }
        
        if (roomDatabase[queryRoom]) {
            const targetRoom = roomDatabase[queryRoom];
            showRoomLocation(targetRoom);

            if (targetRoom.entryNode) {
                const isAccessible = document.getElementById('accessible-toggle').checked;
                
                try {
                    currentActivePath = calculateShortestPath(currentStartNode, targetRoom.entryNode, isAccessible);
                    
                    if(currentActivePath.length <= 1) {
                         throw new Error("No valid route found.");
                    }
                    setActiveFloor(targetRoom.floor);
                    roomInput.blur();
                } catch (err) {
                    console.error("Routing Error:", err);
                    errorMsg.textContent = "Could not calculate route.";
                    errorMsg.style.display = 'block';
                    setActiveFloor(targetRoom.floor);
                }
            } else {
                setActiveFloor(targetRoom.floor);
                roomInput.blur();
            }
        } else {
            errorMsg.textContent = `Room "${queryRoom}" not found in database.`;
            errorMsg.style.display = 'block';
            pin.style.display = 'none';
            const activeBtn = document.querySelector('.floor-btn.active');
            if (activeBtn) renderPath(activeBtn.getAttribute('data-floor'));
        }
    }

    locateBtn.addEventListener('click', executeManualSearch);
    roomInput.addEventListener('input', previewRoomLocation);
    roomInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') executeManualSearch();
    });

    scanBtn.addEventListener('click', () => {
        readerDiv.style.display = 'block';
        const html5QrCode = new Html5Qrcode("reader");
        
        const qrCodeSuccessCallback = (decodedText, decodedResult) => {
            try {
                const url = new URL(decodedText);
                const scannedRoom = url.searchParams.get("room");
                const scannedBuilding = url.searchParams.get("building");
                
                if (scannedBuilding && scannedBuilding !== activeBuilding) {
                    window.location.href = decodedText;
                    return;
                }

                if (scannedRoom && roomDatabase[scannedRoom]) {
                    const startRoomData = roomDatabase[scannedRoom];
                    if (startRoomData.entryNode) {
                        currentStartNode = startRoomData.entryNode;
                        roomInput.placeholder = `You are at ${scannedRoom}. Where to?`;
                        setActiveFloor(startRoomData.floor);
                    }
                }
            } catch (e) {
                console.error("Invalid QR Code scanned.");
                errorMsg.textContent = "Unrecognized QR format.";
                errorMsg.style.display = 'block';
            }

            html5QrCode.stop().then(() => {
                readerDiv.style.display = 'none';
            });
        };

        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback)
            .catch(err => {
                console.error("Camera access denied", err);
                errorMsg.textContent = "Camera access denied. Please check device permissions.";
                errorMsg.style.display = 'block';
                readerDiv.style.display = 'none';
            });
    });

    // ==========================================
    // 3. MAP RENDERING
    // ==========================================
    function renderPath(floorNumber) {
        svgOverlay.innerHTML = ''; 

        if (isDebugMode) {
            for (const [id, data] of Object.entries(waypoints)) {
                if (data.floor == floorNumber) {
                    data.neighbors.forEach(nId => {
                        const nData = waypoints[nId];
                        if (nData && nData.floor == floorNumber) {
                            svgOverlay.innerHTML += `<line x1="${data.x}%" y1="${data.y}%" x2="${nData.x}%" y2="${nData.y}%" stroke="rgba(0,36,78,0.3)" stroke-width="2"/>`;
                        }
                    });
                    svgOverlay.innerHTML += `<circle cx="${data.x}%" cy="${data.y}%" r="4" fill="#00244E" />`;
                    svgOverlay.innerHTML += `<text x="${data.x}%" y="${data.y}%" fill="#00244E" font-size="12" font-family="sans-serif" dy="-8" dx="-6" font-weight="bold">${id}</text>`;
                }
            }
        }

        if (currentActivePath.length > 1) {
            for (let i = 0; i < currentActivePath.length - 1; i++) {
                const n1 = waypoints[currentActivePath[i]];
                const n2 = waypoints[currentActivePath[i + 1]];

                if (n1 && n2 && n1.floor == floorNumber && n2.floor == floorNumber) {
                    svgOverlay.innerHTML += `<line x1="${n1.x}%" y1="${n1.y}%" x2="${n2.x}%" y2="${n2.y}%" stroke="#FDB913" stroke-width="6" />`;
                }
            }
        }

        if (currentActivePath.length > 0 && activeTargetRoom && activeTargetRoom.floor == floorNumber) {
            const finalNodeId = currentActivePath[currentActivePath.length - 1];
            const finalNode = waypoints[finalNodeId];

            if (finalNode && finalNode.floor == floorNumber) {
                svgOverlay.innerHTML += `<line x1="${finalNode.x}%" y1="${finalNode.y}%" x2="${activeTargetRoom.x}%" y2="${activeTargetRoom.y}%" stroke="#FDB913" stroke-width="6" />`;
            }
        }

        if (currentStartNode && waypoints[currentStartNode]) {
            const startNodeData = waypoints[currentStartNode];
            if (startNodeData.floor == floorNumber) {
                startPin.style.left = startNodeData.x + '%';
                startPin.style.top = startNodeData.y + '%';
                startPin.style.display = 'block';
            } else {
                startPin.style.display = 'none';
            }
        }
    }

    // ==========================================
    // 4. DATA INITIALIZATION & QR DASHBOARD
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
        fetch(`data/${activeBuilding}_map.json`)
            .then(response => {
                if (!response.ok) throw new Error(`Could not load ${activeBuilding}_map.json`);
                return response.json();
            })
            .then(data => {
                waypoints = data.waypoints;
                roomDatabase = data.rooms;
                
                setActiveFloor('2');

                if (roomInput.value.trim()) {
                    previewRoomLocation();
                }
                generateQRDashboard();

                const scannedRoom = urlParams.get('room');
                if (scannedRoom && roomDatabase[scannedRoom]) {
                    const startRoomData = roomDatabase[scannedRoom];
                    if (startRoomData.entryNode) {
                        currentStartNode = startRoomData.entryNode;
                        roomInput.placeholder = `You are at ${scannedRoom}. Where to?`;
                        setActiveFloor(startRoomData.floor);
                    }
                }
            })
            .catch(error => {
                console.error("Error loading map data:", error);
                errorMsg.textContent = `System error: Failed to load coordinates for ${activeBuilding} building.`;
                errorMsg.style.display = 'block';
            });
    });

    document.querySelector('.map-wrapper').addEventListener('click', function(e) {
        if (!isDebugMode) return; 
        const rect = this.getBoundingClientRect();
        const clickX = Math.round(((e.clientX - rect.left) / rect.width) * 100);
        const clickY = Math.round(((e.clientY - rect.top) / rect.height) * 100);
        
        const activeBtn = document.querySelector('.floor-btn.active');
        const floor = activeBtn ? activeBtn.getAttribute('data-floor') : 'unknown';
        alert(`"n_NEW": { "floor": ${floor}, "x": ${clickX}, "y": ${clickY}, "neighbors": [] }`);
    });

    function generateQRDashboard() {
        qrGrid.innerHTML = ''; 

        for (const [roomId, roomInfo] of Object.entries(roomDatabase)) {
            const roomUrl = `${baseUrl}?building=${activeBuilding}&room=${roomId}`; 
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(roomUrl)}`;
            
            qrGrid.innerHTML += `
                <div style="text-align: center; border: 1px solid #ccc; padding: 10px; border-radius: 8px; width: 170px;">
                    <img src="${qrImageUrl}" alt="QR for ${roomId}" style="width: 150px; height: 150px;">
                    <h3 style="margin: 10px 0 5px 0; font-size: 14px;">${roomInfo.label}</h3>
                    <p style="margin: 0; font-size: 12px; color: #666;">Room ${roomId}</p>
                </div>
            `;
        }
        
        qrGrid.style.display = "flex";
        qrGrid.style.flexWrap = "wrap";
        qrGrid.style.gap = "20px";
        qrGrid.style.marginTop = "20px";
    }

    document.getElementById('debug-toggle').addEventListener('click', function() {
        isDebugMode = !isDebugMode; 
        const dashboard = document.getElementById('admin-qr-dashboard');
        
        if (isDebugMode) {
            dashboard.style.display = 'flex'; 
            this.style.opacity = '1';
        } else {
            dashboard.style.display = 'none'; 
            this.style.opacity = '0.5';
        }
        
        const activeFloorBtn = document.querySelector('.floor-btn.active');
        if (activeFloorBtn) {
            renderPath(activeFloorBtn.getAttribute('data-floor'));
        }
    });

    // ==========================================
    // 5. ANDROID APP BRIDGE
    // ==========================================
    window.updateLiveLocation = function(liveNodeId) {
        const nodeData = waypoints[liveNodeId] || roomDatabase[liveNodeId];
        
        if (nodeData) {
            currentStartNode = nodeData.entryNode || liveNodeId;
            roomInput.placeholder = "Live Tracking Active...";
            
            if (activeTargetRoom) {
                const targetNode = activeTargetRoom.entryNode;
                const isAccessible = document.getElementById('accessible-toggle').checked;
                currentActivePath = calculateShortestPath(currentStartNode, targetNode, isAccessible);
                renderPath(nodeData.floor);
            } else {
                setActiveFloor(nodeData.floor);
            }
        }
    };

    </script>
</body>
</html>
